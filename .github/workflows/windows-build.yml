name: Windows Build

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Fix fuer "path too long": Cargo holt Git-Abhaengigkeiten (ruv-FANN)
  # ueber das git-Programm statt libgit2, damit core.longpaths greift.
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Enable long paths
        run: |
          git config --system core.longpaths true
          git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4

      - name: Install frontend dependencies
        working-directory: v2/crates/wifi-densepose-desktop/ui
        run: npm ci

      # Tauri CLI per npx statt "cargo install" (spart ca. 10 Minuten)
      - name: Build Tauri app
        working-directory: v2/crates/wifi-densepose-desktop
        run: npx --yes @tauri-apps/cli@^2 build

      - name: Build sensing server
        working-directory: v2
        continue-on-error: true
        run: cargo build --release -p wifi-densepose-sensing-server

      - name: Package portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path portable | Out-Null
          Get-ChildItem v2/target/release/*.exe | Where-Object { $_.Name -notlike "*build-script*" } | Copy-Item -Destination portable
          Get-ChildItem portable
          Compress-Archive -Path portable/* -DestinationPath RuView-Desktop-windows-x64-portable.zip

      - name: Upload installers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ruview-windows-installer
          path: |
            v2/target/release/bundle/msi/*.msi
            v2/target/release/bundle/nsis/*.exe

      - name: Upload portable ZIP
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ruview-windows-portable
          path: RuView-Desktop-windows-x64-portable.zip
